name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 Linux 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --linux AppImage deb --x64 --publish never 2>&1 | tee build-linux.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
      - name: 失败日志推到 ci-logs 分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "ci log: linux ${{ github.ref_name }}" || true
          git push -f origin HEAD:refs/heads/ci-logs || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 Windows 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee build-windows.log
      - name: 生成 MSI（WiX）
        id: msi
        shell: pwsh
        # 失败不阻塞 exe 发布，日志会推到 ci-logs 分支
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'build-msi.log'
          function Step([string]$label, [scriptblock]$block) {
            "== $label" | Tee-Object -FilePath $log -Append
            & $block 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "$label 失败（退出码 $LASTEXITCODE）" }
          }
          Step 'download wix' { curl.exe -sSL -o wix314.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip }
          Expand-Archive wix314.zip -DestinationPath wix -Force
          $wixBin = Join-Path $PWD 'wix'
          $parts = ((Get-Content package.json -Raw | ConvertFrom-Json).version).Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $ver = $parts -join '.'
          $src = Join-Path $PWD 'dist\win-unpacked'
          $lic = Join-Path $PWD 'installer\NOTICE.rtf'
          $rawVer = ((Get-Content package.json -Raw | ConvertFrom-Json).version)
          $msi = Join-Path $PWD 'dist' "TRCL-$rawVer-win-x64.msi"
          Step 'heat' { & (Join-Path $wixBin 'heat.exe') dir $src -cg AppFiles -dr INSTALLFOLDER -gg -g1 -sfrag -srd -var var.SourceDir -out dist\files.wxs }
          Step 'candle product' { & (Join-Path $wixBin 'candle.exe') -nologo "-dSourceDir=$src" "-dVersion=$ver" "-dLicenseRtf=$lic" -out dist\product.wixobj installer\trcl.wxs }
          Step 'candle files' { & (Join-Path $wixBin 'candle.exe') -nologo "-dSourceDir=$src" -out dist\files.wixobj dist\files.wxs }
          Step 'light' { & (Join-Path $wixBin 'light.exe') -nologo -ext WixUIExtension dist\product.wixobj dist\files.wixobj -out $msi }
          "MSI: $msi" | Tee-Object -FilePath $log -Append
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
      - name: 失败日志推到 ci-logs 分支
        # continue-on-error 的步骤不会让 job 变成 failure，所以显式看 outcome
        if: failure() || steps.msi.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "ci log: windows ${{ github.ref_name }}" || true
          git push -f origin HEAD:refs/heads/ci-logs || true

  macos:
    runs-on: macos-14
    continue-on-error: true
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 macOS 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never 2>&1 | tee build-macos-${{ matrix.arch }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    # macOS 产物慢，不阻塞 Release；等 Windows / Linux 出来就先发
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
