name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 Linux 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --linux AppImage deb --x64 --publish never 2>&1 | tee build-linux.log
      - name: 失败日志推到 ci-logs 分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "ci log: ${{ github.job }}" || true
          git push -f origin HEAD:refs/heads/ci-logs || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 Windows 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee build-windows.log
      - name: 失败日志推到 ci-logs 分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "ci log: ${{ github.job }}" || true
          git push -f origin HEAD:refs/heads/ci-logs || true
      - name: 生成 MSI（WiX）
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory | Select-Object -First 1).FullName + '\bin'
          $env:PATH = "$env:PATH;$wixBin"
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          heat dir dist\win-unpacked -cg AppFiles -dr INSTALLFOLDER -gg -g1 -sfrag -srd -var var.SourceDir -out dist\files.wxs
          candle -dSourceDir="$PWD\dist\win-unpacked" -dVersion=$ver -dLicenseRtf="$PWD\installer\NOTICE.rtf" -out dist\product.wixobj installer\trcl.wxs
          candle -dSourceDir="$PWD\dist\win-unpacked" -out dist\files.wixobj dist\files.wxs
          light -ext WixUIExtension dist\product.wixobj dist\files.wixobj -out "dist\TRCL-$ver-win-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.msi

  macos:
    runs-on: macos-14
    # macOS 构建失败不阻塞 Release（Windows / Linux 产物照常发布）
    continue-on-error: true
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 macOS 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never 2>&1 | tee build-macos-${{ matrix.arch }}.log
      - name: 失败日志推到 ci-logs 分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "ci log: ${{ github.job }}" || true
          git push -f origin HEAD:refs/heads/ci-logs || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    # macOS 产物慢，不阻塞 Release；等 Windows / Linux 出来就先发
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
