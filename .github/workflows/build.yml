name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 Linux 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --linux AppImage deb --x64 2>&1 | tee build-linux.log
      - name: 失败日志推到 ci-logs 分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add ci-logs
          git commit -m "ci log: ${{ github.job }}" || true
          git push -f origin HEAD:ci-logs || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 Windows 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --x64 2>&1 | tee build-windows.log
      - name: 失败日志推到 ci-logs 分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add ci-logs
          git commit -m "ci log: ${{ github.job }}" || true
          git push -f origin HEAD:ci-logs || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  macos:
    runs-on: macos-14
    # macOS 构建失败不阻塞 Release（Windows / Linux 产物照常发布）
    continue-on-error: true
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打 macOS 包
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --mac dmg --${{ matrix.arch }} 2>&1 | tee build-macos-${{ matrix.arch }}.log
      - name: 失败日志推到 ci-logs 分支
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-logs
          cp build-*.log ci-logs/ 2>/dev/null || true
          git add ci-logs
          git commit -m "ci log: ${{ github.job }}" || true
          git push -f origin HEAD:ci-logs || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
