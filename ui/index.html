<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>TRCL · Tiny Runtime Craft Launcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">▚</span> TRCL</div>
      <div class="topbar-right">
        <button id="accountsBtn" class="chip">账号</button>
        <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span>实例</span>
          <button id="newInstanceBtn" class="icon-btn" title="新建实例">＋</button>
        </div>
        <div id="instanceList" class="instance-list"></div>
        <button id="importPackBtn" class="ghost wide">导入整合包</button>
      </aside>
      <main id="main" class="main">
        <div class="empty">正在加载…</div>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <div id="modalRoot"></div>

    <script src="hud.js"></script>
    <script src="app.js"></script>
  </body>
</html>
